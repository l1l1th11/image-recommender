# ------------------------------------------------------
# Black (formatter)
# ------------------------------------------------------
[tool.black]
# keep wrapping consistent
line-length = 100
# for python 3.12
target-version = ["py312"]


# ------------------------------------------------------
# Ruff (linter + import sorting)
# ------------------------------------------------------
[tool.ruff.lint]
# rules
# - E: pycodestyle (PEP8 basics)
# - F: pyflakes (unused/undefined etc.)
# - I: import sorting
# - B: flake8-bugbear (bug-prone patterns)
# - UP: pyupgrade (modern syntax on 3.12)
select = ["E", "F", "I", "B", "UP"]

# avoid conflicts with black
# - E203: slicing spacing style
# - E501: line length
ignore = ["E203", "E501"]


# ------------------------------------------------------
# Packaging (make src/ importable via editable install)
# ------------------------------------------------------
[build-system]
# install requirements for pip
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# package metadata
name = "image-recommender"
version = "0.0.1"
requires-python = ">=3.12"
# runtime deps
dependencies = ["numpy", "pillow", "tqdm", "opencv-python", "torch", "torchvision", "umap-learn", "matplotlib"]

[project.optional-dependencies]
# test deps
test = ["pytest"]

[tool.setuptools]
# map root of packages to src/
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
# tell setuptools to discover packages under src/
where = ["src"]
