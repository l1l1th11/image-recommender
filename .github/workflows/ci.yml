name: CI

on:
  pull_request:          # run checks on PRs
  push:                  # and on pushes to main
    branches: [main]

# call reusable workflow for tasks
jobs:
  # lint & format via pre commit action (ruff + black hooks from repo config)
  lint-format:
    uses: ./.github/workflows/python-job.yml
    with: 
      task: lint-format

  # unit tests (pytest)
  tests:
    uses: ./.github/workflows/python-job.yml
    with: 
      task: tests

  cli-smoke:
    uses: ./.github/workflows/python-job.yml
    with: 
      task: cli-smoke