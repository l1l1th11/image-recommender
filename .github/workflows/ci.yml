name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4                 # fetch repo
      - uses: actions/setup-python@v5             # install requested python version for vm
        with: { python-version: '3.12' }
      - uses: pre-commit/action@v3.0.1            # run ruff and black hooks

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install --upgrade pip
      - run: pip install pytest                   # minimal dependencies for tests
      - run: pytest -q