name: image_recommender

channels:
  - pytorch
  - defaults

dependencies:
  - python=3.12

  # core
  - numpy
  - pillow

  # features
  - annoy
  - umap-learn
  - scikit-learn
  - pytorch
  - torchvision

  # visualization
  - matplotlib
  - plotly
  - dash

  # testing
  - pytest

  # tooling
  - pip
  - pip:
      - pre-commit